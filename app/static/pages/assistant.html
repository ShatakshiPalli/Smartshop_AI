<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shopping Assistant · SmartShop AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div class="hero" style="padding-top: 24px; padding-bottom: 18px;">
    <h1>Ask the SmartShop AI Assistant</h1>
    <p class="page-lead">Powered by AI analysis. Search for products first, then ask questions about them.</p>
  </div>
  <div class="chat-window">
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="e.g. Which laptop is best for coding?" />
      <button class="btn btn-primary" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
renderNav('assistant');
const params = new URLSearchParams(location.search);
const productId = params.get('product') || null;
const messagesEl = document.getElementById('messages');

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = `chat-bubble ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

if (productId) {
  addBubble('assistant', "I'm looking at the product you selected. Ask me anything about it!");
} else {
  addBubble('assistant', "Hi! Ask me things like 'Which laptop is best for coding?' or 'Is this good for gaming?' after searching for products.");
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  if (!question) return;
  addBubble('user', question);
  input.value = '';
  addBubble('assistant', 'Thinking...');
  try {
    const res = await apiFetch('/assistant/ask', {
      method: 'POST',
      body: JSON.stringify({ question, product_id: productId }),
    });
    messagesEl.lastChild.remove();
    addBubble('assistant', res.answer);
  } catch (err) {
    messagesEl.lastChild.remove();
    addBubble('assistant', `Sorry, something went wrong: ${err.message}`);
  }
}
</script>
</body>
</html>
