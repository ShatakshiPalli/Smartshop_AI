<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · SmartShop AI</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<div class="container">
  <div class="auth-box panel">
    <h2>Sign in</h2>
    <p class="subtle-center">Access your shopper or admin workspace.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn btn-primary" style="width:100%" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p id="error" style="color:var(--danger); font-size:13px;"></p>
    <p style="text-align:center; font-size:13px; color:var(--muted)">No account? <a href="/register" style="color:var(--primary)">Create one</a></p>
  </div>
</div>
<script src="/static/js/app.js"></script>
<script>
renderNav('login');
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await apiFetch('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    Auth.setToken(res.access_token);
    const user = await apiFetch('/auth/me');
    Auth.setUser(user);
    location.href = user.role === 'admin' ? '/admin' : '/';
  } catch (err) {
    document.getElementById('error').textContent = err.message;
  }
});
</script>
</body>
</html>
